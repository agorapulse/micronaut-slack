dependencies {
    api "com.slack.api:bolt:$boltVersion"

    // AWS SDK v2 — kept as compile-only so downstream consumers can opt in.
    compileOnly 'software.amazon.awssdk:s3'

    compileOnly('io.micronaut.cache:micronaut-cache-core')
    testImplementation('io.micronaut.cache:micronaut-cache-caffeine')

    // Agorapulse Micronaut 5 AWS S3 integration + LocalStack-based integration testing.
    testImplementation 'com.agorapulse:micronaut-amazon-awssdk-s3:5.0.0.RC2'
    testImplementation 'com.agorapulse:micronaut-amazon-awssdk-integration-testing:5.0.0.RC2'

    // JUnit 5 + Micronaut JUnit 5 extension (for the Java S3Test)
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}
