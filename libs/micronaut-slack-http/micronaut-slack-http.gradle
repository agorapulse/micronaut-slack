dependencies {
    api project(':micronaut-slack-core')
    api 'io.micronaut:micronaut-http-server'

    implementation 'io.micronaut:micronaut-jackson-databind'

    testImplementation "com.agorapulse:gru-micronaut:$gruVersion"
    testImplementation 'io.micronaut:micronaut-http-server-netty'
    testImplementation 'io.micronaut:micronaut-http-client'
    testImplementation 'org.mockito:mockito-core:4.8.0'

    // Jetty 12 / Servlet 6 for the AuthTestMockServer used in the slack-bolt tests.
    // Versions come from the Micronaut 5 platform BOM.
    testImplementation 'org.eclipse.jetty:jetty-server'
    testImplementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.8'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.17.2'

    // JUnit 5 + Micronaut JUnit 5 extension (for the Java tests)
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}
